<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RA5 Ejercicio 1 - Sorteo primitiva</title>

    <style>
        div {
            border: 3px solid crimson;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            margin-bottom: 10px;
            background-color: white;
        }

        .contenedor_numeros {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .contenedor_intento {
            display: flex;
            align-items: "center";
            gap: 10px;
        }

        .numero {
            border: 2px solid black;
            text-align: center;
            padding: 5px 0;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        .numero:hover {
            background-color: #f0f0f0;
        }

        .numero.selected {
            color: crimson;
            font-weight: bold;
        }

        .sorteo_num {
            border: 2px solid black;
            padding: 5px 8px;
            border-radius: 5px;
            text-align: center;
            width: 20px;
        }

        button {
            padding: 10px 15px;
            color: black;
            border: 2px solid black;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <script src="./ej2.js"></script>
</body>

</html>
